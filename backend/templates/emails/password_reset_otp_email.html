<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Código de verificación - Bovion</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#f4f7fc;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding:24px;">
        <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff; border-radius:24px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg, #1B4332 0%, #2D6A4F 100%); padding:32px; text-align:center; color:#ffffff;">
              <img src="cid:bovion_logo" alt="Bovion logo" width="80" height="80" style="border-radius:50%; background:#ffffff; display:block; margin:0 auto 16px;" />
              <h1 style="margin:0; font-size:30px;">Código de verificación</h1>
              <p style="margin:16px 0 0; font-size:16px; color:rgba(255,255,255,0.85);">Usa este código para recuperar tu contraseña en la app.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px; color:#1F2937; text-align:center;">
              <p style="font-size:16px; line-height:1.75; margin:0 0 20px;">Hola, tu código de verificación es:</p>
              <div style="display:inline-block; padding:18px 28px; border-radius:14px; background:#f3f7f5; border:1px solid #d7e8de; font-size:32px; letter-spacing:6px; font-weight:700; color:#1B4332;">{{ code }}</div>
              <p style="font-size:15px; line-height:1.75; margin:20px 0 0; color:#6b7280;">Este código expira en 10 minutos y solo puede usarse una vez.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#f8fafc; padding:24px; text-align:center; color:#6b7280; font-size:13px;">
              Bovion - Gestión agrícola profesional
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
