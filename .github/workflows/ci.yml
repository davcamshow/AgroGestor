name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agrogestor_test
          POSTGRES_USER: agrogestor
          POSTGRES_PASSWORD: agrogestor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_NAME: agrogestor_test
          DB_USER: agrogestor
          DB_PASSWORD: agrogestor_test
          DB_HOST: localhost
          DB_PORT: "5432"
          DJANGO_SECRET_KEY: test-key-not-for-prod
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py test --settings=backend.test_settings

  e2e-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agrogestor_e2e
          POSTGRES_USER: agrogestor
          POSTGRES_PASSWORD: agrogestor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests
      - name: Run E2E tests
        env:
          DB_NAME: agrogestor_e2e
          DB_USER: agrogestor
          DB_PASSWORD: agrogestor_e2e
          DB_HOST: localhost
          DB_PORT: "5432"
          DJANGO_SECRET_KEY: test-key-not-for-prod
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,localhost
          DJANGO_SUPERUSER_EMAIL: admin@e2e.com
        run: |
          python manage.py migrate
          python manage.py runserver 0.0.0.0:8000 &
          sleep 5
          python e2e_tests.py

  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check --output-format=github .

  build-backend:
    runs-on: ubuntu-latest
    needs: [test-backend, lint-backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: agrogestor-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
