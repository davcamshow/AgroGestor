name: agrogestor

x-backend-common: &backend-common
  image: agrogestor-backend:poc
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: backend.settings
  volumes:
    - ./backend/logs:/app/logs
    - ./backend/staticfiles:/app/staticfiles
    - ./backend/media:/app/media

services:
  migrate:
    <<: *backend-common
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    restart: "no"

  backend:
    <<: *backend-common
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=12)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  scheduler:
    <<: *backend-common
    command: python manage.py run_notifications_scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
